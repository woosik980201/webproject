<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {

            for (let i = 0; i < 10; i++) {
                let hElement = $("<h1>Created H1 Element Object " + i + "</h1>");

                hElement.css({
                    backgroundColor: "orange",
                    color: "white"
                });

                $("body").append(hElement);

                hElement.dblclick(function () {
                    $(this).remove();
                });
            }

        });
    </script>
</head>
<body>

</body>
</html>
