<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   
    <!-- jquery library 설정-->
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <!-- jquery 문법으로 코드 작성-->
    <script>
   $(document).ready(
    function(){
  for(let i=0; i<10;i++){
    let hElement = $(<h1>Created H1 Element Object + " + i + "</h1>);
    hElement.css({
      backgroundcolor : "orange",
      color : "white",
    });
  $("body").append(hElement);
   hElement.dblclick(
    function(){
      $(this).remove();
    }
   )           
  }
            } 
        );
    </script>
</head>
