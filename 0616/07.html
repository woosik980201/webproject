<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   
    <!-- jquery library 설정-->
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <!-- jquery 문법으로 코드 작성-->
    <script>
   $(document).ready(
    function(){
   $("body").css("background","black");
     
   $("#box").css({
          width : "100px",
          height : "100px",
          background : "orange"   
    
  }
      );
      $("#box").animate({
          width : "300px",
          opacity : "0.2",
      },2000   
   );

      ("#box").animate({
          width : "100px",
          opacity : "1.0",
      },2000   
      );
    }
  );    
    </script>
</head>
<body>
<div id="box"></div>
</body>
</html>
