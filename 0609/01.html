<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>인라인 이벤트 모델 1</title>

    <script>
        function greet() {
            alert("안녕하세요~ 인라인 이벤트 모델2");
        }

        function addStar(btn) {
            btn.textContent += "★";
        }

        function changeColor(btn) {
            btn.style.backgroundColor = "blue";
            btn.style.color = "white";
        }

        function resetColor(btn) {
            btn.style.backgroundColor = "";
            btn.style.color = "";
        }

        let clickCount = 1;

        function changeClickImg(img) {
            clickCount++;

            if (clickCount > 5) {
                clickCount = 1;
            }

            img.src = "imgs/image" + clickCount + ".jpg";
        }

        let slideCount = 1;

        function autoSlide() {
            slideCount++;

            if (slideCount > 5) {
                slideCount = 1;
            }

            document.getElementById("slideImg").src =
                "imgs/image" + slideCount + ".jpg";
        }

        window.onload = function () {
            setInterval(autoSlide, 1000);

            let a1 = document.getElementById("a1");

            a1.onclick = function () {
                return false;
            };
        };
    </script>
</head>

<body>

    <button onclick="alert('인라인 이벤트 모델1')">인라인 이벤트 모델1</button>
    <br><br>

    <button onclick="greet()">인라인 이벤트 모델2</button>
    <button onclick="addStar(this)">별 추가</button>

    <button onmouseover="changeColor(this)"
            onmouseout="resetColor(this)">
        배경 및 글자색 변경
    </button>

    <br><br>

    <img src="imgs/image1.jpg"
         width="400"
         onclick="changeClickImg(this)"
         style="cursor:pointer;">

    <img id="slideImg"
         src="imgs/image1.jpg"
         width="400">

    <br><br>

    <a href="https://www.naver.com/" id="a1">디폴트 이벤트 제거</a>

</body>
</html>
