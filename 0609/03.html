<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- jquery library 설정-->
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <!-- jquery 문법으로 코드 작성-->
    <script>
    $(document).ready(function(){
    $("#second").css("color","magenta");
    $("#second").css("background","black");
    $(".third").css("color","white");
    $(".third").css("background","magenta"); 
    });   
   
    </script>
</head>
<body>
    <h1>jquery 라이브러리 설정 및 문법</h1>
    <h1 id="second">jquery 라이브러리 설정 및 문법</h1>
    <h1 class="third">jquery 라이브러리 설정 및 문법</h1>
    <img src="imgs/image1.jpg" width="400" id="image1"><br><br>
    <h2 id="h2"></h2>

</body>
</html>
